<div id="tavern-kitchen-settings" class="extension_container">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>酒馆后厨 <small>0.1.0</small></b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <p>记住发生过什么，让下一幕有据可循。</p>
      <label class="checkbox_label"><input type="checkbox" data-feature="enabled"><span>启用酒馆后厨</span></label>
      <label class="checkbox_label"><input type="checkbox" data-feature="storySummary"><span>记忆记录与向量召回</span></label>
      <label class="checkbox_label"><input type="checkbox" data-feature="enaPlanner"><span>剧情规划（ENA）</span></label>
      <label class="checkbox_label"><input type="checkbox" data-feature="variablesCore"><span>变量更新与回滚</span></label>
      <label class="checkbox_label"><input type="checkbox" data-feature="variablesPanel"><span>变量查看面板</span></label>
      <label class="checkbox_label"><input type="checkbox" data-feature="xiaobaiOs"><span>世界、地图与骰子工作台</span></label>
      <button class="menu_button" data-action="apply">保存并刷新</button>
      <div class="tk-actions">
        <button class="menu_button" data-action="memory">记忆与召回</button>
        <button class="menu_button" data-action="planner">规划器设置</button>
        <button class="menu_button" data-action="world">打开世界工作台</button>
      </div>
      <p class="tk-note">首次使用请在各模块配置 API。地图自动维护、世界后台、骰子判定默认关闭，按需开启。</p>
      <p class="tk-note">0.1 是小白X的删减版。世界书接管、统一世界内核、多作家编剧室和最终命运骰规则尚未接入。</p>
      <p class="tk-credit">Based on <a href="https://github.com/RT15548/LittleWhiteBox" target="_blank" rel="noopener noreferrer">LittleWhiteBox</a> by biex · 修改版：酒馆后厨</p>
    </div>
  </div>
</div>
